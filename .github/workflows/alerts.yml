name: Alerts

# Two jobs that both end in "a machine noticed something and filed an issue", which is why
# they share one file: they share the deduplication rules in .github/actions/file-alert, and
# two workflows filing issues independently would each get those subtly wrong.
#
# Neither job ever reverts, redeploys or mutates anything. They observe and file.

on:
  # A CI run that went red on main. `workflow_run` so this cannot be skipped by the failure
  # it is reporting on.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Two slow failures that no push will ever surface: the rules data going stale, and the
  # live site falling behind `main`. The first is weekly; the second needs to be noticed the
  # same day, so the schedule runs hourly and each job picks the events it answers to.
  schedule:
    - cron: '0 0 * * 1'
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  ci-failure:
    name: Red CI on main
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Name the jobs that failed
        id: failed
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo,
              run_id: context.payload.workflow_run.id,
            });
            const failed = data.jobs.filter((job) => job.conclusion === 'failure');
            // Naming the job turns "CI is red" into somewhere to look.
            core.setOutput('names', failed.map((job) => `\`${job.name}\``).join(', ') || 'unknown');

      - name: File it
        uses: ./.github/actions/file-alert
        with:
          key: ci-main-failure
          title: 'CI failed on main'
          severity: S1
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            CI failed on `main`, so the commit it verified will not deploy (ADR 0009).

            - Failing job(s): ${{ steps.failed.outputs.names }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Run: ${{ github.event.workflow_run.html_url }}

            Deployment is gated on this run succeeding, so the live site is still the last
            green build. Fix forward on `main`; nothing here has reverted or redeployed
            anything.

  # The question every other deploy check approaches sideways: **is the live site the
  # current main?**
  #
  # #113 is why this exists. Five commits reached `main` with a cancelled CI run, the Pages
  # deploy is gated on CI succeeding (ADR 0009), and so each one silently skipped its deploy
  # — the live site was behind `main` and every dashboard was green. #114 stopped the
  # cancellation and #124 made the served build name itself, but neither closes the hole:
  # the smoke in `deploy.yml` only runs *after* a successful deploy, so a deploy that is
  # cancelled or never starts is still invisible. A cancelled run does not fail, so the
  # `ci-failure` job above does not see it either.
  #
  # Severity is S1 because of what a stale build serves here. `kaeruRules` is
  # effective-dated data compiled into the bundle, so behind-main is not missing features —
  # it is live refund figures computed from superseded rules, with `lastReviewed` shipping
  # in the same stale bundle, so the stale date agrees with the stale rules and nothing on
  # screen contradicts anything.
  deployed-build:
    name: Live site matches main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '25 * * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare the served build against main's head
        id: compare
        uses: actions/github-script@v7
        with:
          script: |
            const { compareDeployedBuild, STAMPING_COMMIT } = await import('${{ github.workspace }}/scripts/deployed-build.mjs');
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            // Does main already contain the commit that introduced the build stamp? An
            // unstamped live build predates it, so once this is true the site is behind by
            // definition. Self-retiring: unreachable once any stamped build is live.
            let stampingLanded = false;
            try {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${STAMPING_COMMIT}...${branch.commit.sha}`,
              });
              stampingLanded = comparison.status === 'identical' || comparison.status === 'ahead';
            } catch {
              // The commit is not in this repository's history at all — nothing to conclude.
              stampingLanded = false;
            }
            const response = await fetch('https://sean1093.github.io/kaeru/', {
              headers: { 'Cache-Control': 'no-cache' },
            });
            const html = response.ok ? await response.text() : '';
            const result = compareDeployedBuild({
              ok: response.ok,
              status: response.status,
              html,
              headSha: branch.commit.sha,
              stampingLanded,
            });
            core.setOutput('stale', String(result.stale));
            core.setOutput('served', result.served);
            core.setOutput('head', branch.commit.sha);

      # The deploy takes a few minutes and the schedule is hourly, so a single disagreement
      # is almost always a deploy in flight rather than one that never happened. Confirmed
      # once, five minutes later, before anyone is told: an alert that fires on a normal
      # deploy is an alert people learn to close unread.
      - name: Confirm it is still behind
        id: confirm
        if: steps.compare.outputs.stale == 'true'
        run: sleep 300

      # Both sides are re-read, not just the site. `main` can move during the wait, and a
      # comparison against the head this job started with would report a site that is
      # current against a commit that is no longer the question (QALead, #130).
      - name: Re-read both sides
        id: recheck
        if: steps.compare.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { compareDeployedBuild, STAMPING_COMMIT } = await import('${{ github.workspace }}/scripts/deployed-build.mjs');
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            // Does main already contain the commit that introduced the build stamp? An
            // unstamped live build predates it, so once this is true the site is behind by
            // definition. Self-retiring: unreachable once any stamped build is live.
            let stampingLanded = false;
            try {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${STAMPING_COMMIT}...${branch.commit.sha}`,
              });
              stampingLanded = comparison.status === 'identical' || comparison.status === 'ahead';
            } catch {
              // The commit is not in this repository's history at all — nothing to conclude.
              stampingLanded = false;
            }
            const response = await fetch('https://sean1093.github.io/kaeru/', {
              headers: { 'Cache-Control': 'no-cache' },
            });
            const html = response.ok ? await response.text() : '';
            const result = compareDeployedBuild({
              ok: response.ok,
              status: response.status,
              html,
              headSha: branch.commit.sha,
              stampingLanded,
            });
            core.setOutput('stale', String(result.stale));
            core.setOutput('served', result.served);
            core.setOutput('head', branch.commit.sha);

      - name: File it
        if: steps.recheck.outputs.stale == 'true'
        uses: ./.github/actions/file-alert
        with:
          key: deployed-build-behind-main
          title: 'The live site is not the current main'
          severity: S1
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            The deployed site is serving a build that is not `main`'s head, and it still was
            five minutes later.

            - Serving: `${{ steps.recheck.outputs.served }}`
            - `main` is at: `${{ steps.recheck.outputs.head }}`
            - Site: https://sean1093.github.io/kaeru/

            This is the condition #113 was about, and it is silent by construction: a deploy
            that is cancelled or never starts does not fail, so nothing else reports it.

            **Where to look, in order.** A deploy run for that commit whose `Build` job reads
            `cancelled` was dropped from the `pages` concurrency group — two runs for one
            commit, the older pending one discarded. A `Build: success` with
            `Deploy: cancelled` is runner exhaustion rather than anything breaking. And
            **there may be no deploy run for that commit at all**, which looks identical from
            the site's side: do not conclude nothing is wrong because nothing is there.

            Nothing has been reverted or redeployed.

            **Fix it by dispatching the deploy workflow on `main`, not by re-running an old
            run.** A re-run deploys the commit *that run was for*, so a re-run landing after a
            newer deploy walks the site backwards — silently, since it succeeds.

  rules-freshness:
    name: Rules data freshness
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The check reads one source file; it needs no dependencies and no build.
      - name: Check the review date and any pending rule
        id: check
        run: |
          if output=$(node scripts/check-rules-review.mjs 2>&1); then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "$output"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo 'findings<<KAERU_EOF'
              echo "$output"
              echo 'KAERU_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "$output"
          fi

      - name: File it
        if: steps.check.outputs.stale == 'true'
        uses: ./.github/actions/file-alert
        with:
          key: rules-review
          title: 'Rules data needs a human review'
          # Stale rules are wrong money and wrong dates shown as fact, which is the S1
          # definition, but nothing is broken today — hence an issue, not a page.
          severity: S1
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            The weekly rules check reported something that needs a person:

            ```
            ${{ steps.check.outputs.findings }}
            ```

            Re-read the sources in `docs/product/domain-rules.md`, update
            `src/domain/rules-data.ts`, and move `lastReviewed` forward only once a human
            has actually checked — moving the date without reading the sources turns this
            alert off while leaving the risk it exists for in place.
