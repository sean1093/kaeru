name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseded pull request runs are cancelled; a run on main never is. Every commit on main
  # must be verified, and the Pages deployment is gated on that run succeeding (ADR 0009),
  # so a cancelled run silently skips the deploy.
  #
  # `cancel-in-progress: false` alone did not achieve that — main runs were being cancelled
  # in practice, which is how six commits reached main unverified and undeployed. So main
  # additionally gets a **group of its own per commit**: two runs on main can never share a
  # concurrency group, and runs in different groups cannot cancel each other whatever the
  # expression below evaluates to. The flag stays as the statement of intent; the group is
  # what enforces it.
  #
  # One thing that looks like this failing and is not: `cancel-in-progress` governs runs that
  # are already in progress, not runs that are queued, and GitHub drops a *pending* run when a
  # newer one enters the same group regardless of the flag. In normal operation that cannot
  # happen, because every commit on main has its own sha and therefore its own group — the
  # only way to put two runs in one group is to deliberately run CI twice on one commit, which
  # is a diagnostic action rather than something a merge does. Re-running CI on main's head to
  # restore verification is exactly that action, so expect a `cancelled` beside a `success`
  # there, and do not read it as this fix having failed.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Only the engines we actually have projects for; Firefox is not a target.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
